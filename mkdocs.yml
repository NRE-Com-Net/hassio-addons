---
# Project information
site_name: "Home Assistant NRE.Com.Net Apps"
site_url: "https://hassio.nrecom.net"
site_description: "Home Assistant apps (formerly add-ons) maintained by Steven Kurz."
site_author: "Steven Kurz"
copyright: "Copyright 2025-2026 - Steven Kurz"

# Repository
repo_name: "hassio-addons"
repo_url: "https://github.com/NRE-Com-Net/hassio-addons"
edit_uri: ""

# Theme configuration
theme:
  name: "material"
  icon:
    logo: material/home-assistant
  language: "en"
  palette:
    primary: "light-blue"
    accent: "blue"
  font:
    text: "Exo 2"
    code: "Roboto Mono"
  features:
    - navigation.tabs
    - toc.integrate

# Customization
extra:
  social:
    - icon: fontawesome/brands/github-alt
      link: "https://github.com/NemesisRE"

# Extensions
markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# The pages to serve
nav:
  - "Our Apps": "index.md"
  - "Contributing": "contributing.md"
  - "Code of Conduct": "code-of-conduct.md"
  - "License": "license.md"
