---
name: Repository issue or app idea
description: A problem with this apps repository itself, or an idea for a new app.
body:
  - type: textarea
    id: motivation
    attributes:
      label: Problem / motivation
      description: Why are you filing this issue?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can someone else make it happen?
  - type: textarea
    id: proposal
    attributes:
      label: Proposed changes
      description: If you have a proposed change, workaround or fix, describe the rationale behind it.
